<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Movers Unit 4 Quiz</title>

  <!-- Kết nối CSS -->
  <link rel="stylesheet" href="style.css">

</head>


<body>

  <div class="game-container">

    <h1>
      🎮 Movers Unit 4 Quiz
    </h1>


    <div
      class="progress"
      id="progress"
    >
      Question 1 of 5
    </div>


    <div
      class="question"
      id="question"
    >
      Loading...
    </div>


    <div
      class="answers"
      id="answers"
    ></div>


    <div
      id="result"
    ></div>


    <button
      class="next-btn"
      id="nextBtn"
      onclick="nextQuestion()"
      style="display:none;"
    >

      Next ➡️

    </button>

  </div>


  <!-- Kết nối JavaScript -->
  <script src="script.js"></script>

</body>

</html>
