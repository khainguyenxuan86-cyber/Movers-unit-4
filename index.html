<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Movers Quiz</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <main class="game-container">

    <header class="game-header">

      <h1 id="gameTitle">
        🎮 Movers Quiz
      </h1>

      <div
        class="progress"
        id="progress"
      >
        Question 1 of 5
      </div>

    </header>


    <section class="question-area">

      <img
        id="questionImage"
        class="question-image"
        src=""
        alt=""
      >

      <div
        class="question"
        id="question"
      >
        Loading...
      </div>

    </section>


    <section
      class="answers"
      id="answers"
    >
    </section>


    <div
      id="result"
      class="result"
    >
    </div>


    <button
      class="next-btn"
      id="nextBtn"
      type="button"
    >
      Next ➡️
    </button>


  </main>


  <!-- Câu hỏi phải load trước -->
  <script src="questions.js"></script>

  <!-- Logic game load sau -->
  <script src="script.js"></script>

</body>

</html>
